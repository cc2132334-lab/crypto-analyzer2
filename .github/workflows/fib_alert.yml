name: Delta 5M Fibonacci Progressive Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # દર 5 મિનિટે રન થશે
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fibonacci Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py
